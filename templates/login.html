<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : sans lui, env(safe-area-inset-*) vaut 0 et la barre
       d'onglets mobile passe sous l'indicateur d'accueil de l'iPhone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Connexion — Financy</title>
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <!-- Ajoutee a l'ecran d'accueil, l'application s'ouvre en plein ecran. -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Financy">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1219" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .login-card { background:#fff; padding:2.5rem; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.08); max-width:360px; width:100%; }
    .login-card h1 { font-size:var(--fs-2xl); margin-bottom:1.5rem; text-align:center; }
    .login-card input[type="password"] { width:100%; padding:.625rem .875rem; border:1px solid var(--border); border-radius:6px; font-size:var(--fs-base); margin-bottom:1rem; }
    .login-card button { width:100%; padding:.625rem; font-size:var(--fs-base); }
    .login-error { color:var(--danger); font-size:var(--fs-sm); margin-bottom:1rem; text-align:center; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1 style="display:flex;align-items:center;justify-content:center;gap:.6rem"><img src="/static/icons/favicon.svg" alt="" width="36" height="36" style="border-radius:10px"> Financy</h1>
    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="password" name="password" placeholder="Mot de passe" autofocus required>
      <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>
  </div>
</body>
</html>
